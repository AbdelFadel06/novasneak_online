# Auto-loaded by plain `docker compose up` alongside docker-compose.yml —
# this is what makes local dev work (live code reload, direct port access).
# Never applied in production: `-f docker-compose.yml -f docker-compose.prod.yml`
# disables Compose's automatic override.yml pickup.
services:
  backend:
    volumes:
      - ./backend:/app:Z
    ports:
      - "8000:8000"

  frontend:
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-http://localhost:3001/script.js}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    volumes:
      - ./frontend:/app:Z
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"

  umami:
    ports:
      - "3001:3000"

volumes:
  frontend_node_modules:
